<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="千机志">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef7ff"/>
      <stop offset="1" stop-color="#ece0f0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="250" r="72" fill="url(#mark)"/>
  <!-- 品牌字的「千」用矢量笔画而非 <text>：社交平台渲染 OG 图时不一定有中文字体，
       用 <text> 可能得到豆腐块。笔画与 favicon 同源，按 72/21 放大。 -->
  <g fill="none" stroke="#fff" stroke-width="10.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M556.4 220.5 L644.9 205.1"/>
    <path d="M546.5 259.9 H653.5"/>
    <path d="M602.7 205.4 V299.4"/>
  </g>
  <text x="600" y="400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="64" font-weight="700" fill="#1d1b20" text-anchor="middle">千机志</text>
  <text x="600" y="456" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="28" fill="#49454f" text-anchor="middle">记录技术、写作与生活</text>
</svg>
